<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f34f3f" />
    <title>KanaMaster · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #fffaf3; color: #20233b; font-family: ui-rounded, system-ui, sans-serif; text-align: center; }
      main { max-width: 360px; }
      img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 16px 40px #f34f3f33; }
      h1 { margin: 22px 0 8px; font-size: 28px; }
      p { margin: 0; color: #67697a; line-height: 1.6; }
      button { margin-top: 24px; border: 0; border-radius: 16px; padding: 14px 22px; color: white; background: #f34f3f; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="KanaMaster" />
      <h1>You’re offline</h1>
      <p>Your saved learning progress is safe on this device. Reconnect to load a page that has not been cached yet.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
